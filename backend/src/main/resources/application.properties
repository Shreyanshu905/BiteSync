server.port=5001

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/bitesync
spring.data.mongodb.auto-index-creation=false

# Security & JWT Configuration
bitesync.jwt.secret=bitesync-secret-jwt-key-2026-super-strong-hmac-sha256-key-for-oops-project-evaluation
bitesync.jwt.expiration-ms=2592000000

# QR Verification HMAC Secret
bitesync.qr.secret=bitesync-qr-secret-key-2026

# Logging
logging.level.com.bitesync=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
